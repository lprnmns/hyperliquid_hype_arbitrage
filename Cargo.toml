[package]
name = "hyperliquid_bot"
version = "0.1.0"
edition = "2021"
authors = ["lprnmns <manasalperen@gmail.com>"]
description = "Ultra-low latency HYPE perpetual-spot arbitrage bot for Hyperliquid"
license = "Proprietary"

[profile.release]
opt-level = 3          # Maximum optimization
lto = true            # Link-time optimization
codegen-units = 1     # Single codegen unit for better optimization
panic = "abort"       # Smaller binary, no unwinding
strip = true          # Strip symbols for smaller binary
overflow-checks = false  # Disable in release for performance

[profile.bench]
inherits = "release"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "parking_lot"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# WebSocket and networking
tungstenite = "0.24"
futures-util = "0.3"
hyper = { version = "1.5", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "http1", "http2", "tokio"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.11"

# Ethereum and cryptography
ethers = "2.0"
hex = "0.4"
sha3 = "0.10"
secp256k1 = "0.29"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"

# Configuration
config = "0.14"
dotenv = "0.15"

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Performance
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "6.1"
once_cell = "1.20"
atomic_float = "1.1"

# Testing and benchmarking
criterion = { version = "0.5", optional = true }
mockito = { version = "1.6", optional = true }

[dev-dependencies]
criterion = "0.5"
mockito = "1.6"
quickcheck = "1.0"
quickcheck_macros = "1.0"
serial_test = "3.1"

[features]
default = []
bench = ["criterion"]
integration = ["mockito"]

[lib]
name = "hyperliquid_bot"
path = "src/lib.rs"

[[bin]]
name = "hyperliquid_bot"
path = "src/main.rs"